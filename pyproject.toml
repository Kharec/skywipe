[project]
name = "skywipe"
version = "0.1.0"
description = "Clean your bluesky account"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["atproto>=0.0.65", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skywipe = "skywipe.cli:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
